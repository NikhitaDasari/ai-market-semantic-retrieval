<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
            background: #f5f7fb;
            color: #1f2937;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .location {
            padding: 20px;
            margin-bottom: 20px;
            background: #f9fafb;
            border-radius: 10px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            margin-right: 8px;
        }

        #result {
            margin-top: 24px;
            padding: 16px;
            background: #f3f4f6;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        nav {
            margin-bottom: 24px;
        }

        nav a {
            margin-right: 16px;
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>

<body>

<nav>
    <a href="/">Sync Weather</a>
    <a href="/search">Semantic Search</a>
</nav>

<div class="card">

    <h1>Weather Intelligence</h1>

    <p class="subtitle">
        Sync National Weather Service forecasts and alerts into Lakebase.
    </p>

    <div id="locations">

        <div class="location">
            <label>Location name</label>
            <input
                type="text"
                class="name"
                value="Chicago, IL"
            >

            <label>Latitude</label>
            <input
                type="number"
                step="any"
                class="lat"
                value="41.8781"
            >

            <label>Longitude</label>
            <input
                type="number"
                step="any"
                class="lon"
                value="-87.6298"
            >
        </div>

    </div>

    <button
        class="secondary"
        onclick="addLocation()"
    >
        Add Location
    </button>

    <button
        class="primary"
        onclick="syncWeather()"
    >
        Sync Weather
    </button>

    <div id="result"></div>

</div>

<script>

function addLocation() {

    const container = document.getElementById("locations");

    const div = document.createElement("div");

    div.className = "location";

    div.innerHTML = `
        <label>Location name</label>
        <input type="text" class="name">

        <label>Latitude</label>
        <input type="number" step="any" class="lat">

        <label>Longitude</label>
        <input type="number" step="any" class="lon">
    `;

    container.appendChild(div);
}


async function syncWeather() {

    const locationDivs =
        document.querySelectorAll(".location");

    const locations = [];

    locationDivs.forEach(div => {

        const name =
            div.querySelector(".name").value.trim();

        const lat =
            parseFloat(div.querySelector(".lat").value);

        const lon =
            parseFloat(div.querySelector(".lon").value);

        if (
            name &&
            !Number.isNaN(lat) &&
            !Number.isNaN(lon)
        ) {
            locations.push({
                name: name,
                lat: lat,
                lon: lon
            });
        }
    });

    const result =
        document.getElementById("result");

    result.textContent =
        "Syncing weather data...";

    try {

        const response = await fetch(
            "/weather/sync",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    locations: locations,
                    limit: 50
                })
            }
        );

        const data = await response.json();

        if (response.ok) {
            result.textContent =
                JSON.stringify(data, null, 2) +
                "\n\nGenerating embeddings...";
            
            // Automatically generate embeddings for new documents
            try {
                const embResponse = await fetch(
                    "/weather/generate-embeddings",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        }
                    }
                );
                
                const embData = await embResponse.json();
                
                result.textContent =
                    JSON.stringify(data, null, 2) +
                    "\n\n" +
                    JSON.stringify(embData, null, 2) +
                    "\n\n✓ Locations synced and ready for search!";
            } catch (embError) {
                result.textContent =
                    JSON.stringify(data, null, 2) +
                    "\n\nEmbedding generation failed: " +
                    embError;
            }
        } else {
            result.textContent =
                JSON.stringify(data, null, 2);
        }

    } catch (error) {

        result.textContent =
            "Request failed: " + error;
    }
}

</script>

</body>
</html>
